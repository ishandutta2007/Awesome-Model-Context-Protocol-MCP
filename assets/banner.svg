<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Circuit Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 1.5px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Animation Keyframes */
      @keyframes pulseFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes breathGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.05); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }

      .pulse-line-1 {
        stroke-dasharray: 8, 12;
        animation: pulseFlow 4s linear infinite;
      }
      .pulse-line-2 {
        stroke-dasharray: 6, 10;
        animation: pulseFlow 3s linear infinite reverse;
      }
      .pulsing-orb {
        animation: breathGlow 5s ease-in-out infinite;
        transform-origin: center;
      }
      .node-float-1 {
        animation: floatNode 6s ease-in-out infinite;
      }
      .node-float-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Ambient Glow Spots (Background layer) -->
  <circle cx="200" cy="100" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="1000" cy="320" r="160" fill="#a855f7" opacity="0.2" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="600" cy="210" r="220" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

  <!-- Animated Data Flow Circuits (Behind Foreground Content) -->
  <g opacity="0.45">
    <!-- Left to Center circuit lines -->
    <path d="M 80 180 Q 250 80 450 160 T 750 180" fill="none" stroke="#6366f1" stroke-width="2" class="pulse-line-1" />
    <path d="M 120 300 C 300 360, 400 240, 600 280 S 900 160, 1100 220" fill="none" stroke="#06b6d4" stroke-width="2" class="pulse-line-2" />
    <path d="M 300 40 L 480 120 L 720 120 L 900 60" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4, 8" opacity="0.5" />
    <path d="M 150 100 L 250 200 L 150 320" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="5, 5" opacity="0.4" />
    <path d="M 1050 100 L 950 210 L 1050 320" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="5, 5" opacity="0.4" />
  </g>

  <!-- Floating Network Topology Nodes (Animated sides) -->
  <!-- Left Side Floating Node Group -->
  <g class="node-float-1" opacity="0.75">
    <g transform="translate(100, 75)">
      <rect width="90" height="34" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
      <text x="45" y="21" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">CLIENT</text>
    </g>
    <g transform="translate(60, 240)">
      <rect width="110" height="34" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
      <text x="55" y="21" fill="#818cf8" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">CLAUDE / AGENT</text>
    </g>
  </g>

  <!-- Right Side Floating Node Group -->
  <g class="node-float-2" opacity="0.75">
    <g transform="translate(1010, 80)">
      <rect width="110" height="34" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" />
      <text x="55" y="21" fill="#c084fc" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">MCP SERVERS</text>
    </g>
    <g transform="translate(1020, 250)">
      <rect width="105" height="34" rx="8" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1" />
      <text x="52" y="21" fill="#f472b6" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle">TOOLS &amp; APIS</text>
    </g>
  </g>

  <!-- FOREGROUND MAIN CONTENT (High z-index, totally unhidden) -->
  <g id="foreground-content">
    <!-- Top Pill Category Badge -->
    <g transform="translate(425, 48)">
      <rect width="350" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" filter="url(#softGlow)" />
      <text x="175" y="19" fill="#c7d2fe" class="tag-text" text-anchor="middle">✦ ANTHROPIC OPEN STANDARD ✦</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="600" y="135" text-anchor="middle" class="title-text" fill="url(#primaryGlow)">
      Awesome Model Context Protocol
    </text>

    <!-- Highlighted Acronym Pill / Sub-header -->
    <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#38bdf8" letter-spacing="4px">
      [ MCP TOOLING &amp; AGENT ECOSYSTEM ]
    </text>

    <!-- Subtitle -->
    <text x="600" y="222" text-anchor="middle" class="subtitle-text">
      The authoritative directory of MCP servers, managed OAuth gateways, SDKs, and developer tools
    </text>
    <text x="600" y="250" text-anchor="middle" class="subtitle-text" font-size="16" fill="#64748b">
      Standardized context and executable action layers connecting Claude, Cursor, Codex, and autonomous agents
    </text>

    <!-- Feature Pills at Bottom -->
    <g transform="translate(160, 290)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="95" y="26" text-anchor="middle" class="pill-text">⚡ Curated MCP Servers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(210, 0)">
        <rect width="215" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="107" y="26" text-anchor="middle" class="pill-text">🔐 Managed Auth &amp; Gateways</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(445, 0)">
        <rect width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="97" y="26" text-anchor="middle" class="pill-text">🛠️ Production SDKs &amp; CLI</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(660, 0)">
        <rect width="220" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="110" y="26" text-anchor="middle" class="pill-text">📈 Enterprise Market Dynamics</text>
      </g>
    </g>

    <!-- Sub-bar footer line inside card -->
    <line x1="200" y1="375" x2="1000" y2="375" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
    <text x="600" y="398" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">
      Maintained by Ishan Dutta • Updated Weekly • Open-Source &amp; Community Contributions Welcome
    </text>
  </g>
</svg>
